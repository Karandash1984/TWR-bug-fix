AKBAR_KHAN_DESC: "Name:\n§YAkbar Khan§!\n\nDescription:\n§gAkbar Khan is a man who demonstrates Pakistan's idiosyncrasies. A general, and yet a leftist. A putschist, and yet a loyalist. A proud Pashtun, and yet an opponent of feudalism. A socialist, and yet involved in an anti-socialist uprising. What makes such a man? It's hard to say. But Akbar Khan is such a man.\n\nBorn into a powerful Pashtun clan in 1912, Akbar Khan first joined the British Army, helping to put down a revolt in Waziristan, before participating in the Pacific War. He was awarded for his activities against the Japanese, but when the war ended, so did his connection to Britain. He defected to the Indian rebels and became a guerrilla leader, acquiring renown for his daring activities in the Khyber Pass and Kashmir.\n\nWhen India's war of independence ended he at first sought to participate in the Indian National Army. But as the Muslims demanded freedom, he could not stand idly by. Yet again, Khan made himself known as a commander for the new-born Pakistan, playing a crucial role in the country's war of independence. But when the war ended, he turned against the establishment, fighting for the establishment of a socialist state. And he won.\n\nKhan has chosen to relegate himself to the role of President, but this name alone does not demonstrate the role he continues to hold in Pakistan's government. Even as Bhutto rules as Prime Minister, few doubt who rules the country behind the scenes. Khan will continue to play a role in Pakistan's politics for the foreseeable future, even as he stands on the periphery of the public eye.§!"

