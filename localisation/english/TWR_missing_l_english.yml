GER_Controls_The_Sky_desc: "Air superiority has always been a deciding factor in our military strategy, ever since the days of the Blitzkrieg. Now, if we wish to rule over the land of Berlin, we must rule over its airspace as well. On a very tactical level, we require more aircraft to directly support our brave soldiers...Far more aircraft than what we can currently produce. We must change that."

GER_Victory_At_GCW_desc: "At last, it ends. May we never again see the day where Germans slaughter Germans so readily. May we never again see our homeland destroyed, not through foreign invasion, but our own suicidal fervor. For the sake of those already passed, and for those who reside in whatever future the victors decide to bring about, they must wield the power they earned through bloodshed wisely and unquestionably."

